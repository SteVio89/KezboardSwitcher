<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!--
    macOS menu bar template image: pure black shapes only.
    The system applies color/opacity for light & dark mode.
    Designed at 22x22 (standard menu bar size, @1x).
  -->

  <!-- Z key outline -->
  <rect x="1" y="5" width="8" height="8" rx="1.5" fill="none" stroke="black" stroke-width="1.2"/>
  <text x="5" y="11.5" text-anchor="middle" font-family="SF Pro, Helvetica" font-size="6" font-weight="700" fill="black">Z</text>

  <!-- Y key outline -->
  <rect x="13" y="5" width="8" height="8" rx="1.5" fill="none" stroke="black" stroke-width="1.2"/>
  <text x="17" y="11.5" text-anchor="middle" font-family="SF Pro, Helvetica" font-size="6" font-weight="700" fill="black">Y</text>

  <!-- Swap arrows -->
  <!-- Top arrow Z→Y -->
  <path d="M 8.5 6.5 L 13.5 6.5" fill="none" stroke="black" stroke-width="1" stroke-linecap="round"/>
  <path d="M 12 5.2 L 13.5 6.5 L 12 7.8" fill="none" stroke="black" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom arrow Y→Z -->
  <path d="M 13.5 11.5 L 8.5 11.5" fill="none" stroke="black" stroke-width="1" stroke-linecap="round"/>
  <path d="M 10 10.2 L 8.5 11.5 L 10 12.8" fill="none" stroke="black" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small keyboard row hint at bottom -->
  <rect x="3" y="17" width="3" height="2" rx="0.5" fill="black" opacity="0.4"/>
  <rect x="7.5" y="17" width="7" height="2" rx="0.5" fill="black" opacity="0.4"/>
  <rect x="16" y="17" width="3" height="2" rx="0.5" fill="black" opacity="0.4"/>
</svg>