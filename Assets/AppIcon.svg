<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS-style gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#007AFF"/>
    </linearGradient>
    <!-- Subtle shadow for keys -->
    <filter id="keyShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Background rounded rect (macOS will mask to squircle) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Z Key (left, slightly tilted) -->
  <g transform="translate(180, 280) rotate(-8, 150, 150)" filter="url(#keyShadow)">
    <rect width="300" height="300" rx="48" fill="#FFFFFF" opacity="0.95"/>
    <rect x="8" y="8" width="284" height="284" rx="40" fill="none" stroke="#E0E0E0" stroke-width="3"/>
    <text x="150" y="200" text-anchor="middle" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="180" font-weight="700" fill="#007AFF">Z</text>
  </g>

  <!-- Y Key (right, slightly tilted opposite) -->
  <g transform="translate(544, 280) rotate(8, 150, 150)" filter="url(#keyShadow)">
    <rect width="300" height="300" rx="48" fill="#FFFFFF" opacity="0.95"/>
    <rect x="8" y="8" width="284" height="284" rx="40" fill="none" stroke="#E0E0E0" stroke-width="3"/>
    <text x="150" y="200" text-anchor="middle" font-family="-apple-system, SF Pro Rounded, Helvetica Neue, sans-serif" font-size="180" font-weight="700" fill="#007AFF">Y</text>
  </g>

  <!-- Swap arrows (curved, between the keys) -->
  <!-- Top arrow: Z → Y -->
  <path d="M 420 340 C 480 280, 544 280, 604 340"
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <polygon points="604,340 580,310 610,318" fill="#FFFFFF"/>

  <!-- Bottom arrow: Y → Z -->
  <path d="M 604 520 C 544 580, 480 580, 420 520"
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <polygon points="420,520 444,550 414,542" fill="#FFFFFF"/>

  <!-- Subtle keyboard base row at bottom -->
  <g opacity="0.25">
    <rect x="192" y="680" width="100" height="60" rx="12" fill="#FFFFFF"/>
    <rect x="312" y="680" width="100" height="60" rx="12" fill="#FFFFFF"/>
    <rect x="432" y="680" width="160" height="60" rx="12" fill="#FFFFFF"/>
    <rect x="612" y="680" width="100" height="60" rx="12" fill="#FFFFFF"/>
    <rect x="732" y="680" width="100" height="60" rx="12" fill="#FFFFFF"/>
  </g>
</svg>